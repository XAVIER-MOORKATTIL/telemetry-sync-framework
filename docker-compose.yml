version: '3.8'

services:
  telemetry-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: telemetry_production_stack
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGO_URI=${MONGO_URI}
      - JWT_SECRET=${JWT_SECRET}
    restart: always